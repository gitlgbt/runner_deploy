networks:
  net1: { ipam: { config: [{ subnet: 172.31.1.0/24 }] } }
  net2: { ipam: { config: [{ subnet: 172.31.2.0/24 }] } }
  net3: { ipam: { config: [{ subnet: 172.31.3.0/24 }] } }
  net4: { ipam: { config: [{ subnet: 172.31.4.0/24 }] } }
  net5: { ipam: { config: [{ subnet: 172.31.5.0/24 }] } }

volumes:
  sock_1:
  sock_2:
  sock_3:
  sock_4:
  sock_5:
  storage_1:
  storage_2:
  storage_3:
  storage_4:
  storage_5:
  data_1:
  data_2:
  data_3:
  data_4:
  data_5: