x-dind: &dind
  image: docker:dind-rootless
  privileged: true
  restart: unless-stopped
  mem_limit: 10g
  memswap_limit: 10g
  cpus: 5
  pids_limit: 8192
  environment:
    DOCKER_TLS_CERTDIR: ""
  command: ["--host=unix:///run/user/1000/docker.sock"]
  depends_on:
    init-perms:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "docker", "-H", "unix:///run/user/1000/docker.sock", "info"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 10s

x-runner: &runner
  image: git.lgbt/gitlgbt/runner:13
  user: "1000:1000"
  restart: unless-stopped
  working_dir: /data
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - DAC_OVERRIDE
  mem_limit: 512m
  pids_limit: 256
  command: >
    sh -c '
      if [ ! -f /data/.runner ]; then
        forgejo-runner register --no-interactive --config /config.yml \
          --instance "$$FORGEJO_INSTANCE_URL" \
          --token "$$FORGEJO_RUNNER_TOKEN" \
          --name "$$RUNNER_NAME" \
          --labels ubuntu-latest:docker://node:24-bookworm;
      fi &&
      forgejo-runner daemon --config /config.yml
    '

services:
  init-perms:
    image: alpine:3
    user: "0:0"
    restart: "no"
    command: >
      sh -c 'for i in 1 2 3 4 5; do
        chown 1000:1000 /v/sock_$$i /v/storage_$$i /v/data_$$i;
        chmod 700 /v/sock_$$i;
      done'
    volumes:
      - sock_1:/v/sock_1
      - sock_2:/v/sock_2
      - sock_3:/v/sock_3
      - sock_4:/v/sock_4
      - sock_5:/v/sock_5
      - storage_1:/v/storage_1
      - storage_2:/v/storage_2
      - storage_3:/v/storage_3
      - storage_4:/v/storage_4
      - storage_5:/v/storage_5
      - data_1:/v/data_1
      - data_2:/v/data_2
      - data_3:/v/data_3
      - data_4:/v/data_4
      - data_5:/v/data_5

  #  runner 1
  dind-1:
    <<: *dind
    container_name: gitlgbt_dind_1
    networks: [net1]
    volumes:
      - sock_1:/run/user/1000
      - storage_1:/home/rootless/.local/share/docker
  runner-1:
    <<: *runner
    container_name: gitlgbt_runner_1
    depends_on:
      dind-1:
        condition: service_healthy
    networks: [net1]
    environment:
      HOME: /data
      RUNNER_NAME: gitlgbt_runner_1
      DOCKER_HOST: unix:///run/user/1000/docker.sock
      FORGEJO_INSTANCE_URL: ${FORGEJO_INSTANCE_URL}
      FORGEJO_RUNNER_TOKEN: ${FORGEJO_RUNNER_TOKEN}
    volumes:
      - data_1:/data
      - ./config.yml:/config.yml:ro
      - sock_1:/run/user/1000

  # runner 2 
